name: collab_note
description: CollabNote - aplikasi manajemen penugasan dan arsip akademik (Flutter, arsitektur berlapis).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  cross_file: ^0.3.5+5
  web: ^1.1.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  archive: '>=3.6.1 <4.0.0'
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/templates/
